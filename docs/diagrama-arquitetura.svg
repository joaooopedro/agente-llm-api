<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="oklch(0.5 0.09 188)"/></marker></defs>
<rect width="1400" height="1010" fill="oklch(0.985 0.004 188)"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="oklch(0.24 0.025 200)">Arquitetura do agente de consultas</text>
<text x="40" y="80" font-size="16" fill="oklch(0.45 0.025 200)">Um modelo de linguagem escolhe a ferramenta; a aplicação executa a consulta em uma API pública real e organiza a resposta.</text>
<rect x="40" y="330" width="200" height="70" rx="10" fill="oklch(0.96 0.008 188)" stroke="oklch(0.80 0.02 188)" stroke-width="1.5"/>
<text x="56" y="358" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Usuário</text>
<text x="56" y="382" font-size="14" fill="oklch(0.45 0.025 200)">escreve a pergunta</text>
<path d="M140 400 V470" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)" fill="none"/>
<rect x="40" y="470" width="200" height="100" rx="10" fill="oklch(0.96 0.008 188)" stroke="oklch(0.80 0.02 188)" stroke-width="1.5"/>
<text x="56" y="498" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Interface web</text>
<text x="56" y="522" font-size="14" fill="oklch(0.45 0.025 200)">public/index.html</text>
<text x="56" y="542" font-size="14" fill="oklch(0.45 0.025 200)">mostra texto, dados</text>
<text x="56" y="562" font-size="14" fill="oklch(0.45 0.025 200)">e a fonte de cada consulta</text>
<rect x="300" y="120" width="600" height="620" rx="14" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="150" font-size="15" font-weight="700" fill="oklch(0.5 0.09 188)">Servidor (função da Vercel, Node.js)</text>
<rect x="330" y="175" width="540" height="100" rx="10" fill="oklch(0.96 0.008 188)" stroke="oklch(0.80 0.02 188)" stroke-width="1.5"/>
<text x="346" y="203" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Serviço da API</text>
<text x="346" y="227" font-size="14" fill="oklch(0.45 0.025 200)">api/chat.js e lib/servico.js</text>
<text x="346" y="247" font-size="14" fill="oklch(0.45 0.025 200)">valida a entrada, limita o uso por IP e trata os erros</text>
<rect x="330" y="330" width="540" height="120" rx="10" fill="oklch(0.94 0.035 188)" stroke="oklch(0.5 0.09 188)" stroke-width="1.5"/>
<text x="346" y="358" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Agente</text>
<text x="346" y="382" font-size="14" fill="oklch(0.45 0.025 200)">lib/agente.js</text>
<text x="346" y="402" font-size="14" fill="oklch(0.45 0.025 200)">repete até 4 rodadas: envia ao modelo, executa a ferramenta</text>
<text x="346" y="422" font-size="14" fill="oklch(0.45 0.025 200)">escolhida e devolve o resultado ao modelo</text>
<rect x="330" y="520" width="540" height="120" rx="10" fill="oklch(0.96 0.008 188)" stroke="oklch(0.80 0.02 188)" stroke-width="1.5"/>
<text x="346" y="548" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Executor de ferramentas</text>
<text x="346" y="572" font-size="14" fill="oklch(0.45 0.025 200)">lib/ferramentas.js</text>
<text x="346" y="592" font-size="14" fill="oklch(0.45 0.025 200)">clima, CEP, cotação e feriados</text>
<text x="346" y="612" font-size="14" fill="oklch(0.45 0.025 200)">timeout de 8 s e erros convertidos em mensagem clara</text>
<rect x="980" y="310" width="380" height="120" rx="10" fill="oklch(0.95 0.03 70)" stroke="oklch(0.62 0.09 70)" stroke-width="1.5"/>
<text x="996" y="338" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Modelo de linguagem</text>
<text x="996" y="362" font-size="14" fill="oklch(0.45 0.025 200)">Google Gemini com function calling</text>
<text x="996" y="382" font-size="14" fill="oklch(0.45 0.025 200)">interpreta a intenção e escolhe</text>
<text x="996" y="402" font-size="14" fill="oklch(0.45 0.025 200)">a ferramenta e os argumentos</text>
<rect x="970" y="480" width="400" height="330" rx="14" fill="none" stroke="oklch(0.62 0.09 70)" stroke-width="2" stroke-dasharray="8 6"/>
<text x="990" y="508" font-size="15" font-weight="700" fill="oklch(0.62 0.09 70)">APIs públicas reais (sem chave, sem simulação)</text>
<rect x="990" y="525" width="360" height="60" rx="10" fill="oklch(0.95 0.03 70)" stroke="oklch(0.62 0.09 70)" stroke-width="1.5"/>
<text x="1006" y="553" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">Open-Meteo</text>
<text x="1006" y="577" font-size="14" fill="oklch(0.45 0.025 200)">clima e previsão</text>
<rect x="990" y="595" width="360" height="60" rx="10" fill="oklch(0.95 0.03 70)" stroke="oklch(0.62 0.09 70)" stroke-width="1.5"/>
<text x="1006" y="623" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">ViaCEP</text>
<text x="1006" y="647" font-size="14" fill="oklch(0.45 0.025 200)">endereço por CEP</text>
<rect x="990" y="665" width="360" height="60" rx="10" fill="oklch(0.95 0.03 70)" stroke="oklch(0.62 0.09 70)" stroke-width="1.5"/>
<text x="1006" y="693" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">AwesomeAPI</text>
<text x="1006" y="717" font-size="14" fill="oklch(0.45 0.025 200)">cotação de moedas</text>
<rect x="990" y="735" width="360" height="60" rx="10" fill="oklch(0.95 0.03 70)" stroke="oklch(0.62 0.09 70)" stroke-width="1.5"/>
<text x="1006" y="763" font-size="18" font-weight="700" fill="oklch(0.24 0.025 200)">BrasilAPI</text>
<text x="1006" y="787" font-size="14" fill="oklch(0.45 0.025 200)">feriados nacionais</text>
<path d="M240 505 H265 V215 H330" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="265" cy="360" r="12" fill="oklch(0.5 0.09 188)"/><text x="265" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">1</text>
<path d="M560 275 V330" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="580" cy="303" r="12" fill="oklch(0.5 0.09 188)"/><text x="580" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">2</text>
<path d="M870 365 H980" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="925" cy="350" r="12" fill="oklch(0.5 0.09 188)"/><text x="925" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">3</text>
<path d="M980 415 H870" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="925" cy="433" r="12" fill="oklch(0.5 0.09 188)"/><text x="925" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">4</text>
<path d="M660 330 V275" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="680" cy="303" r="12" fill="oklch(0.5 0.09 188)"/><text x="680" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">8</text>
<path d="M600 450 V520" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="620" cy="485" r="12" fill="oklch(0.5 0.09 188)"/><text x="620" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">5</text>
<path d="M870 565 H970" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="920" cy="550" r="12" fill="oklch(0.5 0.09 188)"/><text x="920" y="555" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">6</text>
<path d="M970 610 H870" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="920" cy="630" r="12" fill="oklch(0.5 0.09 188)"/><text x="920" y="635" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">7</text>
<path d="M330 250 H285 V540 H240" fill="none" stroke="oklch(0.5 0.09 188)" stroke-width="2" marker-end="url(#p)"/>
<circle cx="285" cy="400" r="12" fill="oklch(0.5 0.09 188)"/><text x="285" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="oklch(1 0 0)">9</text>
<text x="40" y="800" font-size="16" font-weight="700" fill="oklch(0.24 0.025 200)">Fluxo</text>
<text x="40" y="828" font-size="14" fill="oklch(0.45 0.025 200)">1  O usuário envia a pergunta; a interface chama POST /api/chat.</text>
<text x="40" y="848" font-size="14" fill="oklch(0.45 0.025 200)">2  O serviço valida a entrada (vazia, tamanho, limite de uso) e repassa a pergunta ao agente.</text>
<text x="40" y="868" font-size="14" fill="oklch(0.45 0.025 200)">3  O agente envia ao modelo a pergunta e a descrição das 4 ferramentas.</text>
<text x="40" y="888" font-size="14" fill="oklch(0.45 0.025 200)">4  O modelo devolve a ferramenta escolhida e os argumentos (ex.: consultar_cep com 36010011).</text>
<text x="40" y="908" font-size="14" fill="oklch(0.45 0.025 200)">5  A aplicação executa a ferramenta indicada.</text>
<text x="40" y="928" font-size="14" fill="oklch(0.45 0.025 200)">6  O executor faz a chamada HTTP real à API correspondente.</text>
<text x="40" y="948" font-size="14" fill="oklch(0.45 0.025 200)">7  O JSON da API (ou o erro tratado) volta ao agente, que o entrega ao modelo para redigir a resposta em português.</text>
<text x="40" y="968" font-size="14" fill="oklch(0.45 0.025 200)">8  O agente devolve ao serviço a resposta final e os passos executados.</text>
<text x="40" y="988" font-size="14" fill="oklch(0.45 0.025 200)">9  A interface mostra a resposta, a ferramenta usada, a fonte, o tempo e os dados.</text>
</svg>